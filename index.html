<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Imzo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #777777);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --sec: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --text: var(--tg-theme-text-color, #f5f5f5);
      --hint: var(--tg-theme-hint-color, #8a99a8);
      --sec: var(--tg-theme-secondary-bg-color, #232e3c);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif; }
  .wrap { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  p { margin: 0; color: var(--hint); font-size: 14px; }
  .pad-box { position: relative; width: 100%; aspect-ratio: 2 / 1; background: #ffffff;
    border: 2px dashed #9aa5b1; border-radius: 12px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #b0b7bf; font-size: 18px; pointer-events: none; }
  .row { display: flex; gap: 10px; }
  button { flex: 1; padding: 14px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600; }
  #clear { background: var(--sec); color: var(--text); }
  #done { background: var(--btn); color: var(--btn-text); }
</style>
</head>
<body>
<div class="wrap">
  <h1>✍️ Imzo</h1>
  <p>Oq maydonga barmog'ingiz bilan imzo chizing.</p>
  <div class="pad-box">
    <canvas id="pad"></canvas>
    <div id="hint">Shu yerga chizing</div>
  </div>
  <div class="row">
    <button id="clear">Tozalash</button>
    <button id="done">Tayyor</button>
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const W = 300, H = 150, S = 2;           // mantiqiy o'lcham va aniqlik
  const cv = document.getElementById('pad');
  cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d');
  ctx.lineWidth = 2.2 * S; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000';
  const hint = document.getElementById('hint');

  let strokes = [], cur = null;

  function pos(e) {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
  }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    const p = pos(e);
    cur = [p]; strokes.push(cur);
    ctx.beginPath(); ctx.moveTo(p[0] * S, p[1] * S); ctx.lineTo(p[0] * S + 0.1, p[1] * S); ctx.stroke();
    hint.style.display = 'none';
  });
  cv.addEventListener('pointermove', e => {
    if (!cur) return;
    e.preventDefault();
    const p = pos(e);
    cur.push(p);
    ctx.lineTo(p[0] * S, p[1] * S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p[0] * S, p[1] * S);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t =>
    cv.addEventListener(t, () => { cur = null; }));

  document.getElementById('clear').onclick = () => {
    strokes = []; cur = null;
    ctx.clearRect(0, 0, cv.width, cv.height);
    hint.style.display = 'flex';
  };

  // nuqtalarni siyraklashtirib, kichik JSON qilamiz (sendData limiti ~4096 bayt)
  function encode(minDist) {
    const out = [];
    for (const s of strokes) {
      const a = []; let lx = -99, ly = -99;
      s.forEach((p, i) => {
        const x = Math.round(p[0]), y = Math.round(p[1]);
        const last = i === s.length - 1;
        if (Math.hypot(x - lx, y - ly) >= minDist || (last && (x !== lx || y !== ly))) {
          a.push(x, y); lx = x; ly = y;
        }
      });
      out.push(a);
    }
    return JSON.stringify({ s: out });
  }

  document.getElementById('done').onclick = () => {
    if (!strokes.length) { alert("Avval imzo chizing"); return; }
    let data = '';
    for (const d of [2, 3, 4, 6, 8, 12, 16]) {
      data = encode(d);
      if (data.length <= 3900) break;
    }
    if (data.length > 3900) { alert("Imzo juda murakkab, soddaroq chizing"); return; }
    tg.sendData(data);   // bot qabul qiladi va oyna yopiladi
  };
</script>
</body>
</html>
