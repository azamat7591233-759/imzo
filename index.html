<div class="wrap">
    <h1>Подпись</h1>
    <p>Поставьте подпись пальцем на белом поле.</p>
    
    <div class="pad-box">
        <canvas id="pad"></canvas>
        <div id="hint">Рисуйте здесь</div>
    </div>
    
    <div class="row">
        <button id="clear">Очистить</button>
        <button id="done">Готов</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const cv = document.getElementById('pad');
    const ctx = cv.getContext('2d');
    const hint = document.getElementById('hint');

    // Canvas aniqligini to'g'rilash
    cv.width = cv.offsetWidth;
    cv.height = cv.offsetHeight;

    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#000';

    let drawing = false;

    const getPos = (e) => {
        const rect = cv.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return [clientX - rect.left, clientY - rect.top];
    };

    cv.addEventListener('pointerdown', (e) => {
        drawing = true;
        ctx.beginPath();
        const [x, y] = getPos(e);
        ctx.moveTo(x, y);
        hint.style.display = 'none';
    });

    cv.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        const [x, y] = getPos(e);
        ctx.lineTo(x, y);
        ctx.stroke();
    });

    cv.addEventListener('pointerup', () => { drawing = false; });
    cv.addEventListener('pointercancel', () => { drawing = false; });
    cv.addEventListener('pointerleave', () => { drawing = false; });

    // Очистить (Tozalash) tugmasi
    document.getElementById('clear').addEventListener('click', () => {
        ctx.clearRect(0, 0, cv.width, cv.height);
        hint.style.display = 'flex';
    });

    // Готов (Tayyor) tugmasi
    document.getElementById('done').addEventListener('click', () => {
        // Imzo bo'sh emasligini tekshirish
        const blank = document.createElement('canvas');
        blank.width = cv.width;
        blank.height = cv.height;
        if (cv.toDataURL() === blank.toDataURL()) {
            alert('Сначала нарисуйте подпись');
            return;
        }

        const dataURL = cv.toDataURL('image/png');

        if (tg && tg.initData) {
            // Telegram botga yuborish
            tg.sendData(dataURL);
            tg.close();
        } else {
            // Oddiy brauzerda tekshirganda rasm bo'lib yuklanadi
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'imzo.png';
            link.click();
        }
    });
</script>
